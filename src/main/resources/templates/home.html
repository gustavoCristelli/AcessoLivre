<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Acessibilidade - PCD</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" th:href="@{/home.css}">
</head>
<body>

<!-- Barra de Pesquisa e Sugestões -->
<div class="barra-pesquisa">
    <div id="pesquisa-simples">
        <input id="pesquisa-local" type="search" placeholder="Pesquisar local..."
               aria-label="Pesquisar locais acessíveis" role="combobox"
               aria-autocomplete="list" aria-controls="sugestoes-locais"
               aria-expanded="false">
        <ul id="sugestoes-locais" class="sugestoes-locais" role="listbox" hidden></ul>
    </div>
    <div id="pesquisa-trajeto" hidden>
        <div class="campos-trajeto">
            <input id="origem-trajeto" type="search" placeholder="Local de origem"
                   aria-label="Local de origem" role="combobox"
                   aria-autocomplete="list" aria-controls="sugestoes-trajeto"
                   aria-expanded="false">
            <input id="destino-trajeto" type="search" placeholder="Local de destino"
                   aria-label="Local de destino" role="combobox"
                   aria-autocomplete="list" aria-controls="sugestoes-trajeto"
                   aria-expanded="false">
            <ul id="sugestoes-trajeto" class="sugestoes-locais" role="listbox"></ul>
        </div>
        <p id="status-trajeto" aria-live="polite">Selecione os locais de origem e destino.</p>
        <button id="voltar-pesquisa" type="button">Voltar</button>
    </div>
</div>

<!-- Navegação Superior -->
<nav class="navbar-topo" aria-label="Navegação principal">
    <a class="navbar-sobre" href="#sobre">Sobre nós</a>
    <div class="navbar-logo" aria-label="Espaço para logo">Logo</div>
    <p>"Caminhos ficam mais livres quando mapeamos juntos"</p>
</nav>

<!-- Mapa -->
<div id="map"></div>

<!-- Menu Lateral de Ícones -->
<div class="menu-lateral-icones">
    <div class="menu-superior">
        <div class="grupo-superior">
            <div class="item-menu filtros">
                <button id="abrir-filtros" class="icone-menu-btn" type="button"
                        title="Filtros" aria-label="Filtros"
                        aria-controls="painel-filtros" aria-expanded="false">
                    <svg class="icone-filtro" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/>
                    </svg>
                </button>
                <p>Filtros</p>
            </div>
        </div>
        <div class="grupo-inferior">
            <hr class="divider">
            <div class="item-menu contribuir">
                <a class="icone-menu-btn contribuir" title="Contribuir" th:href="@{/contribuir}">+</a>
                <p>Contribuir!</p>
            </div>
        </div>
    </div>

    <div class="menu-inferior">
        <div class="item-menu perfil">
            <a class="icone-menu-btn" title="Perfil" th:href="@{/login}" aria-label="Perfil">
                <svg class="icone-perfil" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5Z"/>
                </svg>
            </a>
            <p>Perfil</p>
        </div>
    </div>
</div>

<!-- Painel Lateral Expansível (Começa Oculto) -->
<div id="menu-detalhes" class="oculto"></div>

<!-- Camada de Filtros e Painel de Opções -->
<button id="filtros-overlay" class="filtros-overlay" type="button"
        aria-label="Fechar filtros" aria-hidden="true" tabindex="-1"></button>
<section id="painel-filtros" class="painel-filtros" role="dialog"
         aria-modal="true" aria-labelledby="filtros-titulo" aria-hidden="true">
    <header class="cabecalho-filtros">
        <h2 id="filtros-titulo">Filtros</h2>
        <button id="fechar-filtros" class="fechar-filtros" type="button"
                aria-label="Fechar filtros">×</button>
    </header>
    <fieldset id="opcoes-filtros" class="opcoes-filtros">
        <legend>Filtros de acessibilidade</legend>
    </fieldset>
    <p id="resultado-filtros" class="resultado-filtros" aria-live="polite"></p>
    <button id="limpar-filtros" class="limpar-filtros" type="button">Limpar filtros</button>
</section>

<!-- Bibliotecas e Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- O trajeto é consultado pela API pública do OSRM no home.js. -->
<script th:src="@{/home.js}"></script>
</body>
</html>
