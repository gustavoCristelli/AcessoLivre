<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/login.css}">
    <link rel="stylesheet" th:href="@{/mapa-fundo.css}">
</head>
<body>
    <!-- Mapa de fundo sem interação -->
    <div id="mapa-fundo" aria-hidden="true"></div>

    <div class="menu-lateral-icones">
        <div class="menu-superior">
            <div class="grupo-superior">
                <div class="item-menu mapa">
                    <a id="botao-explorar" class="icone-menu-btn" title="Início/Explorar"
                       th:href="@{/}" aria-label="Início/Explorar">
                        <svg class="icone-mapa" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
                        </svg>
                    </a>
                    <p>Mapa</p>
                </div>
            </div>
            <div class="grupo-inferior">
                <hr class="divider">
                <div class="item-menu contribuir">
                    <a class="icone-menu-btn contribuir" title="Contribuir" th:href="@{/contribuir}">+</a>
                    <p>Contribuir!</p>
                </div>
            </div>
        </div>

        <div class="menu-inferior">
            <div class="item-menu perfil">
                <a class="icone-menu-btn" title="Perfil" th:href="@{/login}" aria-label="Perfil">
                    <svg class="icone-perfil" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5Z"/>
                    </svg>
                </a>
                <p>Perfil</p>
            </div>
        </div>

    </div>

    <div class="login-container">
        <div class="login-logo">
            <img th:src="@{/img/login2.png}" alt="Logo">
        </div>
        <div class="login-conteudo">
            <h1>Que bom ter você aqui.</h1>
            <p>Entre e planeje sua próxima saída com mais informação e menos surpresas.</p>
            <form>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="voce@exemplo.com">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                <button type="submit">Login</button>
                <a class="explorar-sem-login" th:href="@{/}">Explorar sem entrar</a>
                <p>Primeira vez aqui? <a th:href="@{/cadastro}">Cadastre-se</a></p>
            </form>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/mapa-fundo.js}"></script>
    <script th:src="@{/login.js}"></script>
</body>
</html>
